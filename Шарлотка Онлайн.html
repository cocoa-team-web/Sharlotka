<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Шарлотка Онлайн</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff4e6;--cd:#fffdf9;--tx:#43292b;--mu:#8f7266;--ac:#d94673;--ln:#f0d9c4;--g1:#f6e2c6;--g2:#f1d6b3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1617;--cd:#2b2124;--tx:#f7e9e6;--mu:#b89ca0;--ac:#ff7aa2;--ln:#45343a;--g1:#3a2c2f;--g2:#33262a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1e1617;--cd:#2b2124;--tx:#f7e9e6;--mu:#b89ca0;--ac:#ff7aa2;--ln:#45343a;--g1:#3a2c2f;--g2:#33262a;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 Fredoka,system-ui,sans-serif;overflow-x:hidden}
#menu{max-width:560px;margin:0 auto;padding:16px}
h1{margin:4px 0 12px;font-size:28px}h2{margin:0 0 10px;font-size:18px}
.card{background:var(--cd);border:2px solid var(--ln);border-radius:18px;padding:14px;margin-bottom:14px}
button,input{font:inherit;color:var(--tx)}
button{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:9px 14px;cursor:pointer;font-weight:600}
button.alt{background:var(--g2);color:var(--tx)}button.on{outline:3px solid var(--ac)}
input[type=text]{background:var(--bg);border:2px solid var(--ln);border-radius:12px;padding:9px 12px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.srv{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--ln)}
.srv small{color:var(--mu);display:block}
#st{color:var(--mu);font-size:14px;margin-bottom:8px}
#game{position:fixed;inset:0;background:var(--g1)}
#cv{width:100%;height:100%;display:block;touch-action:none}
#top{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;gap:10px;align-items:center;padding:10px}
#top span{background:var(--cd);border-radius:10px;padding:6px 10px;font-size:14px}
#log{position:absolute;left:10px;bottom:calc(64px + env(safe-area-inset-bottom,0px));width:min(340px,60vw);max-height:30vh;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:3px;font-size:14px;pointer-events:none}
#log div{background:color-mix(in srgb,var(--cd) 88%,transparent);border-radius:10px;padding:3px 9px;width:fit-content;max-width:100%;word-break:break-word}
#bar{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;max-width:420px}
#bar input{flex:1}
#joy{position:absolute;right:22px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;background:color-mix(in srgb,var(--cd) 70%,transparent);border:2px solid var(--ln);touch-action:none;display:none}
#knob{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:var(--ac)}
</style></head><body>
<div id="menu">
<h1>🍰 Шарлотка Онлайн</h1>
<div id="st">Подключаюсь…</div>
<section class="card"><h2>Серверы</h2><div id="list"></div>
<div class="row"><input type="text" id="sn" maxlength="24" placeholder="Название нового сервера"><button id="mk" class="alt">Создать</button></div></section>
<section class="card"><h2>Мой персонаж</h2>
<div class="row"><canvas id="pv" width="130" height="130"></canvas><div style="flex:1;min-width:150px"><input type="text" id="nm" maxlength="14" style="width:100%;box-sizing:border-box" placeholder="Имя"></div></div>
<div class="row" id="sk"></div>
<div class="row"><label>Волосы <input type="color" id="ch"></label><label>Платье <input type="color" id="cb"></label></div></section>
</div>
<div id="game" hidden><canvas id="cv"></canvas>
<div id="top"><button id="back" class="alt">← Выйти</button><span id="sname"></span><span id="cnt"></span></div>
<div id="log"></div>
<div id="bar"><input type="text" id="msg" maxlength="120" placeholder="Чат… (Enter)"><button id="send">➤</button></div>
<div id="joy"><div id="knob"></div></div></div>
<script>
const $=i=>document.getElementById(i), U=n=>window.claude?claude.use(n):Promise.resolve(null);
const SK=[{id:"classic",n:"Классика",hair:"#7a4a2b",body:"#d94673"},{id:"chef",n:"Кондитер",hair:"#3b2a2a",body:"#f4efe8"},{id:"berry",n:"Ягодка",hair:"#c2417a",body:"#7b4fd6"}]; // сюда добавим ваши скины
let db=null,room=null,uid="l"+Math.random().toString(36).slice(2,8),me={name:"Шарлотка",skin:"classic",hair:SK[0].hair,body:SK[0].body};
let servers=[],cur=null,R=null,msgs=[],unChat=null,saveT=0;

function draw(c,x,y,p,k){c.save();c.translate(x,y);c.scale(k,k);
c.fillStyle="rgba(0,0,0,.18)";c.beginPath();c.ellipse(0,19,14,5,0,0,7);c.fill();
c.fillStyle=p.body;c.beginPath();c.moveTo(-13,19);c.lineTo(-8,0);c.lineTo(8,0);c.lineTo(13,19);c.fill();
c.fillStyle="#ffd9bf";c.beginPath();c.arc(0,-8,11,0,7);c.fill();
c.fillStyle=p.hair;c.beginPath();c.arc(0,-10,12,Math.PI,0);c.fill();c.fillRect(-12,-10,4,15);c.fillRect(8,-10,4,15);
c.fillStyle="#3a2a2a";c.fillRect(-5,-7,2.5,3);c.fillRect(3,-7,2.5,3);c.restore();}
function preview(){const c=$("pv").getContext("2d");c.clearRect(0,0,130,130);draw(c,65,70,me,2.4)}

// ---- персонаж ----
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{db&&db.doc("players/"+uid).set(me).catch(()=>{})},700)}
function upd(){preview();$("nm").value=me.name;$("ch").value=me.hair;$("cb").value=me.body;
[...$("sk").children].forEach(b=>b.classList.toggle("on",b.dataset.id===me.skin))}
SK.forEach(s=>{const b=document.createElement("button");b.className="alt";b.dataset.id=s.id;b.textContent=s.n;
b.onclick=()=>{me.skin=s.id;me.hair=s.hair;me.body=s.body;upd();save()};$("sk").append(b)});
$("nm").oninput=e=>{me.name=e.target.value.slice(0,14)||"Шарлотка";preview();save()};
$("ch").oninput=e=>{me.hair=e.target.value;preview();save()};
$("cb").oninput=e=>{me.body=e.target.value;preview();save()};
upd();

// ---- список серверов ----
function count(id){return room?room.peers().filter(p=>p.presence.srv===id).length:0}
function renderList(){const L=$("list");L.textContent="";
if(!servers.length){L.textContent="Серверов пока нет. Создайте первый!";return}
servers.forEach(s=>{const d=document.createElement("div");d.className="srv";
const t=document.createElement("div");t.textContent=s.name;const sm=document.createElement("small");sm.textContent="онлайн: "+count(s.id);t.append(sm);
const b=document.createElement("button");b.textContent="Играть";b.onclick=()=>enter(s);d.append(t,b);L.append(d)})}
renderList();
$("mk").onclick=()=>{const n=$("sn").value.trim();if(!n)return;
if(!db){$("st").textContent="Чтобы создавать серверы, войдите в аккаунт Claude.";return}
db.collection("servers").add({name:n.slice(0,24),t:Date.now()}).then(()=>$("sn").value="").catch(()=>$("st").textContent="Не удалось создать сервер.")};

// ---- игра ----
const W=1600,H=1000,keys={},joy={x:0,y:0},pos={x:W/2,y:H/2},others=new Map();let run=false,last=0,sent=0,moved=false;
const cv=$("cv"),ctx=cv.getContext("2d");
function fit(){const d=devicePixelRatio||1;cv.width=cv.clientWidth*d;cv.height=cv.clientHeight*d;ctx.setTransform(d,0,0,d,0,0)}
addEventListener("resize",fit);
addEventListener("keydown",e=>{if(!run)return;if(document.activeElement===$("msg")){if(e.key==="Escape")$("msg").blur();return}
if(e.key==="Enter"){$("msg").focus();e.preventDefault();return}keys[e.key.toLowerCase()]=1});
addEventListener("keyup",e=>{delete keys[e.key.toLowerCase()]});
if(matchMedia("(pointer:coarse)").matches)$("joy").style.display="block";
const jy=$("joy");let jid=null;
function jm(e){const r=jy.getBoundingClientRect();let dx=e.clientX-r.left-60,dy=e.clientY-r.top-60;const l=Math.hypot(dx,dy)||1,k=Math.min(l,40)/l;dx*=k;dy*=k;joy.x=dx/40;joy.y=dy/40;$("knob").style.transform=`translate(${dx}px,${dy}px)`}
jy.onpointerdown=e=>{jid=e.pointerId;jy.setPointerCapture(jid);jm(e)};
jy.onpointermove=e=>{if(e.pointerId===jid)jm(e)};
jy.onpointerup=jy.onpointercancel=()=>{jid=null;joy.x=joy.y=0;$("knob").style.transform=""};

async function enter(s){cur=s;$("menu").hidden=true;$("game").hidden=false;$("sname").textContent=s.name;fit();msgs=[];renderLog();others.clear();
pos.x=W/2+Math.random()*100-50;pos.y=H/2+Math.random()*100-50;
if(room)room.presence({srv:s.id});
if(room){try{R=await room.join("g-"+s.id.toLowerCase().slice(0,44));R.onPeers(()=>{$("cnt").textContent="Игроков: "+R.peers().length});pres(true)}catch(e){R=null}}
if(db)unChat=db.collection("chat/"+s.id+"/msgs").orderBy("t","desc").limit(40).onSnapshot(sn=>{msgs=sn.docs.map(d=>d.data()).reverse();renderLog()},()=>{});
run=true;last=performance.now();requestAnimationFrame(loop)}
function leave(){run=false;$("game").hidden=true;$("menu").hidden=false;unChat&&unChat();unChat=null;R&&R.leave();R=null;room&&room.presence({srv:null});renderList()}
$("back").onclick=leave;
function pres(f){if(!R)return;R.presence({x:Math.round(pos.x),y:Math.round(pos.y),n:me.name,h:me.hair,b:me.body,u:uid})}
function renderLog(){const L=$("log");L.textContent="";msgs.slice(-6).forEach(m=>{const d=document.createElement("div"),b=document.createElement("b");b.textContent=(m.name||"?")+": ";d.append(b,document.createTextNode(m.text||""));L.append(d)})}
function send(){const t=$("msg").value.trim().slice(0,120);if(!t||!cur)return;$("msg").value="";
const m={uid,name:me.name,text:t,t:Date.now()};
if(db){const col=db.collection("chat/"+cur.id+"/msgs");col.add(m).catch(()=>{});
if(Math.random()<.1)col.where("t","<",Date.now()-864e5).limit(20).get().then(s=>s.docs.forEach(d=>col.doc(d.id).delete())).catch(()=>{})}
else{msgs.push(m);renderLog()}}
$("send").onclick=send;$("msg").onkeydown=e=>{if(e.key==="Enter"){send();e.preventDefault()}};

function loop(now){if(!run)return;const dt=Math.min(.05,(now-last)/1000);last=now;
let dx=joy.x,dy=joy.y;if(keys.a||keys.arrowleft||keys["ф"])dx-=1;if(keys.d||keys.arrowright||keys["в"])dx+=1;
if(keys.w||keys.arrowup||keys["ц"])dy-=1;if(keys.s||keys.arrowdown||keys["ы"])dy+=1;
const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}
if(l>.05){pos.x=Math.max(20,Math.min(W-20,pos.x+dx*190*dt));pos.y=Math.max(30,Math.min(H-20,pos.y+dy*190*dt));moved=true}
if(moved&&now-sent>70){sent=now;moved=false;pres()}
const w=cv.clientWidth,h=cv.clientHeight,cx=Math.max(0,Math.min(W-w,pos.x-w/2)),cy=Math.max(0,Math.min(H-h,pos.y-h/2));
ctx.clearRect(0,0,w,h);ctx.save();ctx.translate(-cx,-cy);
const cs=getComputedStyle(document.documentElement),g1=cs.getPropertyValue("--g1"),g2=cs.getPropertyValue("--g2");
for(let i=Math.floor(cx/100);i<(cx+w)/100;i++)for(let j=Math.floor(cy/100);j<(cy+h)/100;j++){if(i<0||j<0||i>=W/100||j>=H/100)continue;ctx.fillStyle=(i+j)%2?g1:g2;ctx.fillRect(i*100,j*100,100,100)}
ctx.strokeStyle="#d94673";ctx.lineWidth=6;ctx.strokeRect(0,0,W,H);
const list=[{x:pos.x,y:pos.y,p:{hair:me.hair,body:me.body},n:me.name,u:uid,me:1}];
if(R)R.peers().forEach(q=>{if(q.isMe)return;const p=q.presence;if(typeof p.x!=="number")return;
let o=others.get(q.peer);if(!o){o={x:p.x,y:p.y};others.set(q.peer,o)}o.x+=(p.x-o.x)*.25;o.y+=(p.y-o.y)*.25;
list.push({x:o.x,y:o.y,p:{hair:String(p.h||"#555"),body:String(p.b||"#999")},n:String(p.n||"?"),u:p.u})});
list.sort((a,b)=>a.y-b.y).forEach(o=>{draw(ctx,o.x,o.y,o.p,1.5);
ctx.font="600 13px Fredoka,system-ui,sans-serif";ctx.textAlign="center";ctx.fillStyle=o.me?"#d94673":"#43292b";ctx.fillText(o.n.slice(0,14),o.x,o.y-34);
const m=[...msgs].reverse().find(m=>m.uid===o.u&&Date.now()-m.t<6000);
if(m){const tx=m.text.slice(0,40),tw=ctx.measureText(tx).width+14;ctx.fillStyle="#fff";ctx.beginPath();ctx.roundRect(o.x-tw/2,o.y-66,tw,22,8);ctx.fill();ctx.fillStyle="#43292b";ctx.fillText(tx,o.x,o.y-51)}});
ctx.restore();requestAnimationFrame(loop)}

// ---- подключение к данным ----
(async()=>{
const t=setTimeout(()=>{if($("st").dataset.ok!=="1")$("st").textContent="Сервер данных пока не отвечает. Можно играть в одиночном режиме."},10000);
const [d,u,r]=await Promise.all([U("db"),U("user"),U("room")]);
room=r;if(room)room.onPeers(()=>{if(!run)renderList()});
if(u){try{uid=(await u.id())||uid}catch(e){}}
if(!d){clearTimeout(t);$("st").textContent="Одиночный режим: войдите в Claude, чтобы играть онлайн, с чатом и сохранением персонажа.";
servers=[{id:"solo",name:"Одиночный мир"}];renderList();return}
db=d;
try{const s=await db.doc("players/"+uid).get();if(s.exists){me=Object.assign(me,s.data());upd()}}catch(e){}
db.collection("servers").orderBy("name").onSnapshot(sn=>{clearTimeout(t);$("st").dataset.ok="1";$("st").textContent="Онлайн. Выберите сервер.";servers=sn.docs.map(x=>({id:x.id,name:String(x.data().name||"Сервер")}));renderList()},()=>{$("st").textContent="Не удалось загрузить серверы."})
})();
</script></body></html>
